<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create a receipt — zreceipt</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="zreceipt home"><img src="brand/zreceipt-logo.svg" alt="zreceipt" width="236" height="64"></a>
    <nav class="nav" aria-label="Main">
      <a class="hide-sm" href="/#how">How it works</a>
      <a href="/verify.html">Verify</a>
      <a class="btn small-btn" href="/create.html" aria-current="page">Create a receipt</a>
    </nav>
  </header>

  <main class="tool" id="main">
    <h1>Create a receipt</h1>
    <p class="sub">One link per payment. Whoever opens it can check that payment and nothing else.</p>

    <form id="form" novalidate>
      <fieldset class="inline">
        <legend>Network</legend>
        <div class="segmented">
          <label><input type="radio" name="net" value="main" checked><span>Mainnet</span></label>
          <label><input type="radio" name="net" value="test"><span>Testnet</span></label>
        </div>
      </fieldset>

      <div>
        <label for="txid">Transaction ID
          <span class="hint">In your wallet, open the payment and copy its transaction ID.</span></label>
        <input id="txid" type="text" autocomplete="off" spellcheck="false" placeholder="64 characters">
      </div>

      <div>
        <label for="ufvk">Viewing key of the wallet that paid
          <span class="hint">Starts with uview. It can read the wallet but cannot spend from it, and it stays in this browser.</span></label>
        <textarea id="ufvk" autocomplete="off" spellcheck="false" placeholder="uview1…"></textarea>
      </div>

      <details>
        <summary>Paste the raw transaction instead</summary>
        <p class="small" style="margin-top:10px">Use this if the explorer is unreachable. Leave it empty to fetch the transaction automatically.</p>
        <textarea id="rawtx" spellcheck="false" placeholder="Raw transaction hex"></textarea>
      </details>

      <div><button class="btn" id="go" type="submit">Find my payments</button></div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div class="results" id="results"></div>
  </main>
</div>

<script type="module">
  import { engine, fetchTx, normalizeTxid, formatZec, POOL_NAME, el, validateField } from "./app.js";

  const rawBox = () => document.getElementById("rawtx").value.trim();
  const vTxid = validateField(document.getElementById("txid"), (v) => {
    v = v.trim();
    if (!v) return rawBox() ? "" : "Enter the transaction ID from your wallet.";
    return /^[0-9a-fA-F]{64}$/.test(v) ? "" : "A transaction ID is 64 letters and numbers. Copy it again from your wallet.";
  });
  const vKey = validateField(document.getElementById("ufvk"), (v) =>
    !v.trim() ? "Paste the viewing key of the wallet that paid." :
    v.trim().startsWith("uview") ? "" : "A viewing key starts with uview. Check that you copied the viewing key, not an address.");

  const form = document.getElementById("form");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const go = document.getElementById("go");

  function say(msg, kind = "") {
    status.innerHTML = "";
    if (msg) status.append(el("p", { class: `notice ${kind}`, text: msg }));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    results.innerHTML = "";
    const net = form.net.value;
    const ufvk = document.getElementById("ufvk").value.trim();
    const raw = document.getElementById("rawtx").value.trim();
    let txid = document.getElementById("txid").value;

    const okTx = vTxid.run(), okKey = vKey.run();
    if (!okTx || !okKey) {
      (okTx ? document.getElementById("ufvk") : document.getElementById("txid")).focus();
      return;
    }
    try {
      go.disabled = true;
      say("Fetching the transaction and checking its outputs…");
      const eng = await engine();
      let hex = raw;
      if (!hex) {
        txid = normalizeTxid(txid);
        hex = (await fetchTx(txid, net)).hex;
      }
      const found = JSON.parse(eng.createReceipts(hex, ufvk, net));
      if (!found.length) {
        say("This wallet did not pay anything in this transaction. Check the network, and that the viewing key belongs to the wallet that paid.", "error");
        return;
      }
      say(found.length === 1 ? "Found 1 payment from this wallet." : `Found ${found.length} outputs from this wallet. One of them may be change sent back to yourself.`);
      for (const f of found) results.append(card(f));
    } catch (err) {
      say(String(err.message || err), "error");
    } finally {
      go.disabled = false;
    }
  });

  function card({ receipt, disclosed: d }) {
    const link = `${location.origin}/verify.html#${receipt}`;
    const input = el("input", { type: "text", readonly: "", value: link, "aria-label": "Receipt link" });
    const copy = el("button", { class: "btn small-btn", type: "button", text: "Copy link" });
    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(link);
      copy.textContent = "Copied";
      setTimeout(() => (copy.textContent = "Copy link"), 1800);
    });
    const open = el("a", { class: "btn secondary small-btn", href: link, target: "_blank", rel: "noopener", text: "Open receipt" });

    const rows = el("dl", { class: "rows" });
    const row = (k, v, mono) => { if (v) rows.append(el("div", {}, el("dt", { text: k }), el("dd", mono ? { class: "mono", text: v } : { text: v }))); };
    row("To", d.recipient, true);
    row("Memo", d.memo || "No memo");
    row("Pool", `${POOL_NAME[d.pool]}, output ${d.index}`);

    return el("article", { class: "payment" },
      el("p", { class: "value", text: `${formatZec(d.value_zat)} ZEC` }),
      rows,
      el("div", { class: "share" }, input, copy, open),
    );
  }
</script>
</body>
</html>
