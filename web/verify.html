<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a receipt — zreceipt</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="zreceipt home"><img src="brand/zreceipt-logo.svg" alt="zreceipt" width="236" height="64"></a>
    <nav class="nav" aria-label="Main">
      <a class="hide-sm" href="/#how">How it works</a>
      <a href="/verify.html" aria-current="page">Verify</a>
      <a class="btn small-btn" href="/create.html">Create a receipt</a>
    </nav>
  </header>

  <main class="tool" id="main">
    <h1 id="title">Verify a receipt</h1>
    <p class="sub" id="intro">Paste the receipt you were sent. Your browser checks it against the Zcash blockchain.</p>
    <div id="out" role="status" aria-live="polite"></div>

    <div id="formwrap">
    <form id="form" novalidate>
      <div>
        <label for="receipt">Receipt
          <span class="hint">A link or code starting with zrcpt1.</span></label>
        <textarea id="receipt" spellcheck="false" placeholder="zrcpt1…"></textarea>
      </div>
      <details>
        <summary>Paste the raw transaction instead</summary>
        <p class="small" style="margin-top:10px">Check without contacting any server. Leave it empty to fetch the transaction from the explorer.</p>
        <textarea id="rawtx" spellcheck="false" placeholder="Raw transaction hex"></textarea>
      </details>
      <div><button class="btn" id="go" type="submit">Verify receipt</button></div>
    </form>
    </div>
  </main>
</div>

<script type="module">
  import { engine, fetchTx, renderResult, CROSS_SVG, el, validateField } from "./app.js";
  const vReceipt = validateField(document.getElementById("receipt"), (v) =>
    !v.trim() ? "Paste the receipt link or code you were sent." :
    /zrcpt1[A-Za-z0-9_-]+/.test(v) ? "" : "This is not a receipt. A receipt link contains a code starting with zrcpt1.");

  const form = document.getElementById("form");
  const out = document.getElementById("out");
  const go = document.getElementById("go");
  const box = document.getElementById("receipt");
  const title = document.getElementById("title");
  const intro = document.getElementById("intro");

  const extract = (text) => (text.match(/zrcpt1[A-Za-z0-9_-]+/) || [text.trim()])[0];

  async function verify(code) {
    out.innerHTML = "";
    out.append(el("p", { class: "spinner-text", text: "Fetching the transaction and checking the receipt…" }));
    go.disabled = true;
    try {
      const eng = await engine();
      const r = JSON.parse(eng.inspectReceipt(code));
      const raw = document.getElementById("rawtx").value.trim();
      const meta = raw ? { hex: raw } : await fetchTx(r.txid, r.net);
      const d = JSON.parse(eng.verifyReceipt(meta.hex, code));
      out.innerHTML = "";
      out.append(el("section", { class: "verdict", "aria-label": "Verified payment" }, renderResult(d, r, meta)));
      title.textContent = "Payment receipt";
      intro.textContent = "Checked in your browser against the Zcash blockchain, not by this website's server.";
      tuckForm();
    } catch (err) {
      showFailed(String(err.message || err));
    } finally {
      go.disabled = false;
    }
  }

  function tuckForm() {
    const wrap = document.getElementById("formwrap");
    if (wrap.parentElement.tagName === "DETAILS") return;
    const d = el("details", { class: "verify-again" }, el("summary", { text: "Check a different receipt" }));
    wrap.replaceWith(d);
    d.append(wrap);
  }

  function showFailed(reason) {
    out.innerHTML = "";
    title.textContent = "Receipt not verified";
    intro.textContent = "This receipt could not be confirmed. The reason is below.";
    const badge = el("span", { class: "badge bad" });
    badge.innerHTML = CROSS_SVG;
    badge.append("Not verified");
    out.append(el("section", { class: "verdict failed" },
      badge,
      el("p", { text: reason }),
      el("p", { class: "small", text: "A receipt fails if it was edited, belongs to a different transaction, or the transaction is not on the network it names." }),
    ));
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!vReceipt.run()) { box.focus(); return; }
    const code = extract(box.value);
    history.replaceState(null, "", "#" + code);
    verify(code);
  });

  const fromHash = extract(decodeURIComponent(location.hash.slice(1)));
  if (fromHash.startsWith("zrcpt1")) {
    box.value = fromHash;
    tuckForm();
    intro.textContent = "Someone shared a payment receipt with you. Your browser is checking it against the Zcash blockchain.";
    verify(fromHash);
  }

  // Editing the link in the address bar only changes the hash, which does not reload the page.
  addEventListener("hashchange", () => {
    const code = extract(decodeURIComponent(location.hash.slice(1)));
    if (!code.startsWith("zrcpt1") || code === box.value) return;
    box.value = code;
    tuckForm();
    verify(code);
  });
</script>
</body>
</html>
