[workspace]
members = [".", "wasm"]

[package]
name = "zreceipt"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
hex = "0.4.3"
orchard = { version = "0.15", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zcash_keys = { version = "0.16", features = ["orchard", "sapling"] }
zcash_note_encryption = "0.4"
zcash_primitives = { version = "0.30.1", default-features = false, features = ["std"] }
zcash_protocol = "0.10"
zip32 = "0.2.1"

[dev-dependencies]
orchard = { version = "0.15", features = ["circuit"] }
rand = "0.8"
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
