[package]
name = "zreceipt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
hex = "0.4.3"
orchard = "0.15"
sapling = { package = "sapling-crypto", version = "0.7" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zcash_keys = { version = "0.16", features = ["orchard", "sapling"] }
zcash_note_encryption = "0.4"
zcash_primitives = "0.30.1"
zcash_protocol = "0.10"
zip32 = "0.2.1"

[dev-dependencies]
rand = "0.8"
